[project]
name = "video_cls"
version = "0.1.0"
description = "CPU video frame classification at scale with Spark (ISAAC Instruments workshop)"
requires-python = "==3.12.*"            # DBR 18 LTS ML runs Python 3.12
# No runtime dependencies on purpose: the Databricks ML runtime supplies torch, numpy and
# pandas, and the jobs install the pinned onnx/onnxruntime/opencv as cluster libraries.
# Declaring them here would let pip replace the runtime's own versions.
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==21.0.0",
  "protobuf==5.29.4",
  "onnx==1.21.0",
  "onnxruntime==1.31.0",
  "opencv-python-headless==4.11.0.86",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "pyspark==4.1.0",
  "mlflow-skinny==3.17.2",
  "matplotlib==3.10.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
