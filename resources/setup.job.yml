# Setup on serverless: schema/volume, source clips, replication, synthetic JSON, events table.
# No cluster start-up and no vCPU quota; 00 installs OpenCV itself. Model export and the
# single-node benchmark need PyTorch and a fixed node type, so they run at the start of the
# benchmark job, on its cluster (see benchmark.job.yml).
resources:
  jobs:
    video_cls_setup:
      name: 00-video-cls-setup
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED      # fast serverless start-up rather than lowest cost
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: schema, default: "${var.schema}"}
        - {name: volume, default: "${var.volume}"}

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              source_clips_path: ${var.source_clips_path}
              n_clips: ${var.n_clips}
