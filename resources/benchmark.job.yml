# Models and benchmarks for a small vCPU quota, all on ONE cluster (driver + bench_workers 4-vCPU
# workers, 20 vCPUs with the defaults), so there is a single cluster start-up:
#   1. export_models      01: ResNet-18/50 -> ONNX fp32 + int8 (on the driver; workers idle)
#   2. single_node_bench  02: PyTorch vs ONNX vs int8 on the driver, same node type as the workers
#   3. bench_sweep        03: core sweep at 4, 8, 16 concurrent tasks (throughput vs cores)
# Each pass reads its own max_clips clips; rows are labelled sweep_cap<k> with total_cores = k.
# The cluster uses the compute policy from databricks.yml (policy_id) and on-demand VMs, since
# spot pre-emption mid-run would distort the timings.
resources:
  jobs:
    video_cls_benchmark:
      name: 01-video-cls-benchmark
      max_concurrent_runs: 1
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: schema, default: "${var.schema}"}
        - {name: volume, default: "${var.volume}"}
        - name: runs
          default: "resnet18:fp32,resnet18:int8,resnet18:torch"
        - {name: task_caps, default: "4,8,16"}       # concurrent tasks per pass; max = bench_workers x 4
        - {name: max_clips, default: "48"}           # clips per pass (divisible by every cap); 3 passes x 48 = 144 clips
        - {name: n_partitions, default: "0"}         # ignored when task_caps is set (partitions = cap)
        - {name: batch_size, default: "64"}          # Arrow maxRecordsPerBatch = images per forward pass
        - {name: n_frames, default: "10"}

      job_clusters:
        - job_cluster_key: bench
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_id: ${var.driver_node_type_id}
            num_workers: ${var.bench_workers}
            policy_id: ${var.policy_id}
            apply_policy_default_values: true
            azure_attributes:
              availability: ON_DEMAND_AZURE
            data_security_mode: SINGLE_USER           # dedicated: /Volumes paths work in UDFs
            single_user_name: ${workspace.current_user.userName}
            runtime_engine: STANDARD                  # Photon off: no gain for Python UDFs
            spark_conf:
              spark.sql.execution.arrow.maxRecordsPerBatch: "64"

      tasks:
        - task_key: export_models
          job_cluster_key: bench
          notebook_task:
            notebook_path: ../notebooks/01_export_models.py
          libraries: &libraries
            - pypi: {package: onnx==1.21.0}
            - pypi: {package: onnxruntime==1.31.0}
            - pypi: {package: opencv-python-headless==4.11.0.86}

        - task_key: single_node_bench
          depends_on: [{task_key: export_models}]
          job_cluster_key: bench
          notebook_task:
            notebook_path: ../notebooks/02_single_node_bench.py
          libraries: *libraries

        - task_key: bench_sweep
          depends_on: [{task_key: single_node_bench}]
          job_cluster_key: bench
          notebook_task:
            notebook_path: ../notebooks/03_cluster_bench.py
            base_parameters: {num_workers: "${var.bench_workers}", ort_threads: "1", run_label: "sweep"}
          libraries: *libraries
