bundle:
  name: isaac-video-classification

include:
  - resources/*.yml

# Nothing is built at deploy time: notebooks import src/video_cls from this folder and ship it to
# Spark executors by value. That keeps the bundle deployable from a Git folder in the workspace UI.

variables:
  # EDIT THESE TWO before deploying (workspace UI: edit this file in the Git folder, then Deploy).
  # The CLI can override them instead: --var catalog=... --var schema=...
  catalog:
    description: Existing Unity Catalog catalog. The bundle never creates catalogs.
    default: CHANGE_ME_CATALOG
  schema:
    description: Schema for tables and the volume. Created by 00_setup if missing.
    default: CHANGE_ME_SCHEMA
  # EDIT THIS TOO: the ID of the compute policy your job clusters must use (Compute > Policies >
  # open the policy; the ID is on the policy page and in its URL). It is attached to every classic
  # job cluster (benchmark, fine-tune). An ID rather than a name lookup: a wrong value then fails
  # only the deploy, with a message, instead of the whole bundle ("failed to resolve").
  policy_id:
    description: ID of the compute policy attached to every classic job cluster.
    default: CHANGE_ME_POLICY_ID

  volume:
    description: Volume holding clips/, json/, models/ and labels/.
    default: video
  source_clips_path:
    description: >-
      Folder of source MP4s to replicate (e.g. an existing D2-City raw/ folder). Leave empty to
      download D2-City into /Volumes/<catalog>/<schema>/<volume>/d2_city.
    default: ""
  n_clips:
    description: Number of clip_ids to create by replicating the source clips.
    default: "1000"
  # Low-vCPU defaults (this branch): every classic cluster is built from 4-vCPU nodes, and the
  # largest one (the benchmark) is 1 driver + bench_workers workers = 20 vCPUs at peak.
  node_type_id:
    description: Worker node type, also the setup driver (single-node benchmark). 4 vCPUs, 8 GB.
    default: Standard_F4s_v2
  driver_node_type_id:
    description: Driver of the benchmark cluster.
    default: Standard_F4s_v2
  bench_workers:
    description: >-
      Workers in the benchmark cluster. Peak vCPUs = (bench_workers + 1) x 4. The core sweep
      (task_caps on the benchmark job) can go up to bench_workers x 4 cores.
    default: "4"
  spark_version:
    description: Latest LTS ML CPU runtime. Verified with `databricks clusters spark-versions`.
    default: 18.x-cpu-ml-scala2.13

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
